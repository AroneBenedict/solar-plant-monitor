name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov --cov-fail-under=90
      - name: Build a 60-day database
        run: python -m solarmon.pipeline --db smoke.db --seed 11 --days 60

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t solar-plant-monitor .
      - name: Start the service and call it
        run: |
          docker run -d -p 8000:8000 --name app solar-plant-monitor
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/plants
          curl -sf -o report.xlsx "localhost:8000/api/reports/monthly?month=2025-06"
          test -s report.xlsx
